[project]
name = "sih-harmonization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "databases[sqlite]>=0.7.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.8.0",
    "spacy>=3.7.0",
    "spacy-transformers>=1.3.0",
    "rapidfuzz>=3.9.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.7.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"